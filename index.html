    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          // Embeds use ?theme=light|dark|auto, since the host page sets the look
          var t = params.has("embed")
            ? params.get("theme") || "light"
            : localStorage.getItem("theme");
          var d =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>

      <h1 style="margin: 0 0 16px 0">
        Parliament Seats – Coalition Calculator & Parliament Chart Maker
      </h1>

      <p style="margin: 0 0 16px 0">
        Parliament Seats is a free tool for exploring how the seats in a
        parliament are shared out, and checking whether a coalition reaches a
        majority.
      </p>

      <h2 style="margin: 0 0 12px 0">Features</h2>
      <ul style="margin: 0 0 16px 20px; padding: 0">
        <li>
          Coalition calculator with simple, three-fifths, two-thirds,
          three-quarters, and custom majorities, plus blocking minorities and an
          optional tie breaker
        </li>
        <li>Half-pie parliament chart and seat bar</li>
        <li>Coalitions by political spectrum, from far left to far right</li>
        <li>
          Custom parliaments with your own parties, seats, colours, name, and
          date
        </li>
        <li>
          Share links, JSON import and export, PNG images for social media, and
          embeds for websites
        </li>
        <li>Available in English, German, French, Dutch, and Turkish</li>
      </ul>

      <h2 style="margin: 0 0 12px 0">Supported parliaments</h2>
      <ul style="margin: 0 0 16px 20px; padding: 0">
        <li>European Union (European Parliament)</li>
        <li>Australia (House of Representatives and Senate)</li>
        <li>Austria (Nationalrat)</li>
        <li>Belgium (Kamer / Chambre)</li>
        <li>Canada (House of Commons / Chambre des communes)</li>
        <li>France (Assemblée nationale)</li>
        <li>Germany (Bundestag)</li>
        <li>Malta (House of Representatives)</li>
        <li>Netherlands (Tweede Kamer)</li>
        <li>New Zealand (House of Representatives)</li>
        <li>South Africa (National Assembly)</li>
        <li>Turkey (Türkiye Büyük Millet Meclisi)</li>
        <li>United Kingdom (House of Commons)</li>
      </ul>
