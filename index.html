    <link rel="manifest" href="/site.webmanifest" />
    <title>Parliament Seats - Parliament Seat & Coalition Majority Calculator</title>
    <meta
      name="description"
      content="Interactive parliament seat distribution and coalition majority calculator for Germany, France, the UK, Canada, the EU and more."
    />

    <meta
      property="og:title"
      content="Parliame - Parliament Seat & Coalition Majority Calculator"

      name="twitter:title"

  <body>
    <div id="root"></div>
    <noscript
      style="
        display: block;
        background: #ffffff;
        color: #030712;
        padding: 16px;
        border-radius: 16px;
        margin: 8px auto;
        font-family: sans-serif;
        line-height: 1.5;
        border: 2px solid #e5e7eb;
        max-width: 720px;
      "
    >
      <h1 style="margin: 0 0 16px 0">
        Parliame - Parliament Seat & Coalition Majority Calculator
      </h1>

      <p style="margin: 0 0 16px 0">
        Parliame is an interactive tool for visualizing parliamentary seat
        distributions and checking whether a coalition reaches a majority.
      </p>

      <p style="margin: 0 0 16px 0">
        Supported examples include the European Union, Germany, Austria, the
        Netherlands, Belgium, the United Kingdom, South Africa, Australia,
        Canada, France, and New Zealand.
      </p>

      <p style="margin: 0 0 16px 0">
        You can also create a custom parliament configuration and test coalition
        combinations manually.
      </p>

      <h2 style="margin: 0 0 12px 0">Supported parliaments</h2>
      <ul style="margin: 0 0 16px 20px; padding: 0">
        <li>European Union</li>
        <li>Germany (Bundestag)</li>
        <li>Austria (Nationalrat)</li>
        <li>Netherlands (Tweede Kamer)</li>
        <li>Belgium (Kamer / Chambre)</li>
        <li>United Kingdom (House of Commons)</li>
        <li>South Africa (National Assembly)</li>
        <li>Australia</li>
        <li>Canada</li>
        <li>France</li>
        <li>New Zealand</li>
      </ul>

      <p style="margin: 0 0 16px 0">
        This application works only with JavaScript enabled. Please enable
        JavaScript in your browser settings and reload the page to use this
        application.
      </p>

      <p style="margin: 0">
        &copy; 2026
        <a
          href="https://disfordave.com"
          rel="noreferrer noopener"
          target="_blank"
          >@disfordave</a
        >
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
